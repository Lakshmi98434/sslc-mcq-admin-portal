<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSLC Science — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F3;
    --rule:#C3D2EA;
    --margin:#C0504D;
    --ink:#202B3C;
    --ink-soft:#5B6577;
    --green:#3F7D5C;
    --red:#B23B3B;
    --gold:#C98A2C;
    --gold-ink:#5C3B0C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:920px; margin:0 auto; padding:36px 24px 80px; }
  header.page-head{ margin-bottom:24px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px; }
  .eyebrow{ font-size:13px; color:var(--ink-soft); }
  h1{ font-family:'Spectral', serif; font-weight:600; font-size:28px; margin:2px 0 0; }
  h1 .accent{ color:var(--margin); }
  .who{ font-size:13px; color:var(--ink-soft); cursor:pointer; }

  .card{
    background:#fff;
    border:1px solid rgba(32,43,58,0.12);
    border-radius:4px;
    padding:22px;
    margin-bottom:18px;
  }

  label{ display:block; font-size:13px; color:var(--ink-soft); margin:14px 0 5px; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=email], input[type=password], textarea, select{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:14.5px;
    padding:9px 10px;
    border:1px solid rgba(32,43,58,0.25);
    border-radius:3px;
    background:transparent;
    color:var(--ink);
  }
  textarea{ resize:vertical; min-height:56px; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--margin); }

  .btn{
    display:inline-block; font-family:'Work Sans', sans-serif; font-weight:600; font-size:14px;
    padding:9px 18px; border-radius:3px; border:1.5px solid var(--ink); background:transparent;
    color:var(--ink); cursor:pointer;
  }
  .btn:hover{ background:rgba(32,43,58,0.06); }
  .btn-primary{ background:var(--gold); border-color:var(--gold); color:var(--gold-ink); }
  .btn-primary:hover{ filter:brightness(0.95); }
  .btn-danger{ border-color:var(--red); color:var(--red); }
  .btn-danger:hover{ background:rgba(178,59,59,0.08); }
  .btn-sm{ padding:5px 12px; font-size:12.5px; }
  .btn-row{ margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }

  .error-msg{ color:var(--red); font-size:13.5px; margin-top:10px; }
  .hidden{ display:none !important; }

  .filters{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .filters > div{ flex:1; min-width:160px; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  thead th{
    text-align:left; font-size:12px; text-transform:none; color:var(--ink-soft);
    border-bottom:1.5px solid var(--ink); padding:8px 6px; font-weight:600;
  }
  tbody td{ padding:10px 6px; border-bottom:1px solid var(--rule); vertical-align:top; }
  tbody tr:hover{ background:rgba(32,43,58,0.03); }
  .q-cell{ max-width:340px; }
  .tag{ display:inline-block; font-size:11.5px; color:var(--ink-soft); border:1px solid var(--rule); border-radius:10px; padding:2px 8px; margin-top:4px; }
  .row-actions{ white-space:nowrap; }
  .row-actions .btn{ margin-right:6px; }

  .option-row{ display:flex; gap:10px; margin-top:8px; }
  .option-row .letter{
    flex:0 0 28px; height:38px; border:1.5px solid var(--ink); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; margin-top:2px;
  }
  .option-row.is-correct .letter{ background:var(--green); border-color:var(--green); color:#fff; }
  .option-row input{ flex:1; }
  .correct-note{ font-size:12px; color:var(--ink-soft); margin-top:8px; }

  .empty{ color:var(--ink-soft); font-size:14px; padding:16px 0; text-align:center; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head" id="topbar" style="display:none;">
    <div>
      <div class="eyebrow">SSLC Science — Admin</div>
      <h1>Question <span class="accent">bank</span>.</h1>
    </div>
    <div class="who" id="whoami" onclick="logout()"></div>
  </header>

  <!-- LOGIN VIEW -->
  <section id="view-login">
    <header class="page-head">
      <div>
        <div class="eyebrow">SSLC Science — Admin</div>
        <h1>Sign in to <span class="accent">manage</span> questions.</h1>
      </div>
    </header>
    <div class="card" style="max-width:420px;">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="username">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password">
      <div class="btn-row"><button class="btn btn-primary" onclick="doLogin()">Log in</button></div>
      <div class="error-msg hidden" id="login-error"></div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="view-dashboard" class="hidden">

    <div class="card">
      <div class="filters">
        <div>
          <label for="filter-subject">Subject</label>
          <select id="filter-subject" onchange="onFilterSubjectChange()"></select>
        </div>
        <div>
          <label for="filter-chapter">Chapter</label>
          <select id="filter-chapter"><option value="">All chapters</option></select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="applyFilters()">Filter</button>
        <button class="btn btn-primary" onclick="openForm()">+ Add question</button>
      </div>
    </div>

    <div class="card">
      <div id="table-wrap"><div class="empty">Loading…</div></div>
    </div>

    <!-- ADD / EDIT FORM -->
    <div class="card hidden" id="form-card">
      <h2 style="font-family:'Spectral',serif;font-size:20px;margin:0 0 10px;" id="form-title">Add question</h2>

      <label for="f-subject">Subject</label>
      <input type="text" id="f-subject" placeholder="e.g. Physics">

      <label for="f-chapter">Chapter / topic</label>
      <input type="text" id="f-chapter" placeholder="e.g. Force and Pressure">

      <label for="f-question">Question</label>
      <textarea id="f-question" placeholder="Type the question text"></textarea>

      <label>Options — tap a letter to mark the correct answer</label>
      <div id="option-rows"></div>

      <label for="f-explanation">Explanation <span style="font-weight:400;">(shown to students after they answer)</span></label>
      <textarea id="f-explanation" placeholder="Why is this the correct answer?"></textarea>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveQuestion()">Save question</button>
        <button class="btn" onclick="closeForm()">Cancel</button>
      </div>
      <div class="error-msg hidden" id="form-error"></div>
    </div>

  </section>

</div>

<script>
/* ===== CONFIG ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbz2CXnrk-HZOnze5jIt_G4kjQps3bDGId5fjmDv0zSuwyp_uMChpP5jzF438DWXGvLp/exec";

/* ===== state ===== */
let admin = JSON.parse(sessionStorage.getItem('mcq_admin') || 'null');
let allQuestions = [];
let subjects = [];
let editingId = null;
let correctIndex = 1;

/* ===== API helpers ===== */
async function apiGet(action, params) {
  const qs = new URLSearchParams({ action, ...params });
  const res = await fetch(`${API_URL}?${qs.toString()}`);
  const json = await res.json();
  if (!json.success) throw new Error(json.error || 'Request failed');
  return json.data;
}
async function apiPost(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error || 'Request failed');
  return json;
}

/* ===== auth ===== */
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  try {
    const data = await apiPost('adminLogin', { email, password });
    admin = { email: data.email };
    sessionStorage.setItem('mcq_admin', JSON.stringify(admin));
    afterLogin();
  } catch (e) {
    errEl.textContent = e.message; errEl.classList.remove('hidden');
  }
}

function logout() {
  admin = null;
  sessionStorage.removeItem('mcq_admin');
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('view-dashboard').classList.add('hidden');
  document.getElementById('view-login').classList.remove('hidden');
}

async function afterLogin() {
  document.getElementById('view-login').classList.add('hidden');
  document.getElementById('view-dashboard').classList.remove('hidden');
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('whoami').textContent = `${admin.email} · logout`;
  await loadSubjectFilter();
  await loadAndRenderTable();
}

/* ===== filters ===== */
async function loadSubjectFilter() {
  subjects = await apiGet('getSubjects', {});
  const sel = document.getElementById('filter-subject');
  sel.innerHTML = '<option value="">All subjects</option>' + subjects.map(s => `<option value="${s}">${s}</option>`).join('');
}

async function onFilterSubjectChange() {
  const subject = document.getElementById('filter-subject').value;
  const chapSel = document.getElementById('filter-chapter');
  if (!subject) { chapSel.innerHTML = '<option value="">All chapters</option>'; return; }
  const chapters = await apiGet('getChapters', { subject });
  chapSel.innerHTML = '<option value="">All chapters</option>' + chapters.map(c => `<option value="${c}">${c}</option>`).join('');
}

function applyFilters() { loadAndRenderTable(); }

/* ===== table ===== */
async function loadAndRenderTable() {
  const wrap = document.getElementById('table-wrap');
  wrap.innerHTML = '<div class="empty">Loading…</div>';
  const subject = document.getElementById('filter-subject').value;
  const chapter = document.getElementById('filter-chapter').value;
  allQuestions = await apiGet('getAllQuestions', { subject, chapter });
  if (allQuestions.length === 0) {
    wrap.innerHTML = '<div class="empty">No questions yet. Click "Add question" to create the first one.</div>';
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Question</th><th>Correct</th><th></th></tr></thead>
      <tbody>
        ${allQuestions.map(q => `
          <tr>
            <td class="q-cell">
              ${escapeHtml(q.question)}
              <div><span class="tag">${escapeHtml(q.subject)}</span> <span class="tag">${escapeHtml(q.chapter)}</span></div>
            </td>
            <td>${String.fromCharCode(64 + q.correctIndex)}. ${escapeHtml(q.options[q.correctIndex - 1])}</td>
            <td class="row-actions">
              <button class="btn btn-sm" onclick="openForm(${q.id})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="removeQuestion(${q.id})">Delete</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

/* ===== add / edit form ===== */
function renderOptionRows(options) {
  const container = document.getElementById('option-rows');
  container.innerHTML = ['A','B','C','D'].map((letter, i) => `
    <div class="option-row ${correctIndex === i + 1 ? 'is-correct' : ''}" id="opt-row-${i}">
      <div class="letter" onclick="setCorrect(${i + 1})" title="Mark as correct answer">${letter}</div>
      <input type="text" id="opt-input-${i}" placeholder="Option ${letter}" value="${options ? escapeAttr(options[i] || '') : ''}">
    </div>
  `).join('') + '<div class="correct-note">Tap a letter to mark it as the correct answer. Currently: ' + String.fromCharCode(64 + correctIndex) + '</div>';
}

function setCorrect(i) {
  correctIndex = i;
  const options = [0,1,2,3].map(i => document.getElementById('opt-input-' + i).value);
  renderOptionRows(options);
}

function openForm(id) {
  const formCard = document.getElementById('form-card');
  formCard.classList.remove('hidden');
  document.getElementById('form-error').classList.add('hidden');
  editingId = id || null;

  if (id) {
    const q = allQuestions.find(q => q.id === id);
    document.getElementById('form-title').textContent = 'Edit question';
    document.getElementById('f-subject').value = q.subject;
    document.getElementById('f-chapter').value = q.chapter;
    document.getElementById('f-question').value = q.question;
    document.getElementById('f-explanation').value = q.explanation || '';
    correctIndex = q.correctIndex;
    renderOptionRows(q.options);
  } else {
    document.getElementById('form-title').textContent = 'Add question';
    document.getElementById('f-subject').value = document.getElementById('filter-subject').value || '';
    document.getElementById('f-chapter').value = '';
    document.getElementById('f-question').value = '';
    document.getElementById('f-explanation').value = '';
    correctIndex = 1;
    renderOptionRows(null);
  }
  formCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeForm() {
  document.getElementById('form-card').classList.add('hidden');
  editingId = null;
}

async function saveQuestion() {
  const subject = document.getElementById('f-subject').value.trim();
  const chapter = document.getElementById('f-chapter').value.trim();
  const question = document.getElementById('f-question').value.trim();
  const options = [0,1,2,3].map(i => document.getElementById('opt-input-' + i).value.trim());
  const explanation = document.getElementById('f-explanation').value.trim();
  const errEl = document.getElementById('form-error');
  errEl.classList.add('hidden');

  if (!subject || !chapter || !question || options.some(o => !o)) {
    errEl.textContent = 'Fill in the subject, chapter, question and all four options.';
    errEl.classList.remove('hidden');
    return;
  }

  const payload = { subject, chapter, question, options, correctIndex, explanation };
  try {
    if (editingId) {
      await apiPost('editQuestion', { id: editingId, ...payload });
    } else {
      await apiPost('addQuestion', payload);
    }
    closeForm();
    await loadSubjectFilter();
    await loadAndRenderTable();
  } catch (e) {
    errEl.textContent = e.message; errEl.classList.remove('hidden');
  }
}

async function removeQuestion(id) {
  if (!confirm('Delete this question? This cannot be undone.')) return;
  await apiPost('deleteQuestion', { id });
  await loadAndRenderTable();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

/* ===== boot ===== */
(function init() {
  if (API_URL.indexOf('PASTE_YOUR') === 0) {
    document.body.innerHTML = '<div class="wrap"><div class="card"><b>Setup needed:</b> open index.html and paste your Apps Script web app URL into API_URL near the bottom of the file.</div></div>';
    return;
  }
  if (admin) { afterLogin(); }
})();
</script>
</body>
</html>
